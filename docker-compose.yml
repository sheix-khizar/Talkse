services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talkse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talkse
      POSTGRES_PASSWORD: talkse
      POSTGRES_DB: talkse
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talkse -d talkse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talkse_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Talkse-backend/Talkse-backend
      dockerfile: Dockerfile
    container_name: talkse_backend
    restart: unless-stopped
    env_file:
      - ./Talkse-backend/Talkse-backend/.env
    environment:
      DATABASE_URL: postgresql://talkse:talkse@postgres:5432/talkse
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    container_name: talkse_frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  postgres_data:
